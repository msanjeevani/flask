<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - HealthCare AI</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f5f5f5; /* Light background */
    }

    .login-box{
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
      animation: fadeIn 0.6s ease;
      border-top: 8px solid #ff7f00; /* Orange top border like appointments page */
    }

    @keyframes fadeIn{
      from{
        opacity: 0;
        transform: translateY(20px);
      }
      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1{
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }

    p{
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    .input-group{
      margin-bottom: 15px;
    }

    label{
      font-size: 14px;
      font-weight: 500;
      color: #222;
      display: block;
      margin-bottom: 6px;
    }

    input{
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ddd;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
      background: #f9fbff;
    }

    input:focus{
      border-color: #ff7f00; /* Orange focus */
      background: #fff;
      box-shadow: 0px 0px 0px 3px rgba(255,127,0,0.15);
    }

    .btn{
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff7f00;  /* Orange button */
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 5px;
    }

    .btn:hover{
      background: #e67300;  /* Darker orange hover */
      transform: translateY(-2px);
    }

    .extra{
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    .extra a{
      color: #ff7f00; /* Orange link */
      font-weight: 600;
      text-decoration: none;
    }

    .extra a:hover{
      text-decoration: underline;
    }

    /* Message Box */
    .message{
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .success{
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .error{
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Login</h1>
    <p>Welcome back! Please login to continue</p>

    <div id="msgBox" class="message"></div>

    <form id="loginForm">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn"><a href="dashboard.html">Login</a></button>
    </form>

    <div class="extra">
      New user? <a href="register.html">Sign Up</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const msgBox = document.getElementById("msgBox");

    form.addEventListener("submit", function(e){
      e.preventDefault();

      let email = document.getElementById("email").value;
      let pass = document.getElementById("password").value;

      // Dummy validation (frontend only)
      if(email === "test@gmail.com" && pass === "123456"){
        msgBox.style.display = "block";
        msgBox.className = "message success";
        msgBox.innerText = "✅ Login Successful!";
      } else {
        msgBox.style.display = "block";
        msgBox.className = "message error";
        msgBox.innerText = "❌ Invalid Email or Password!";
      }
    });
  </script>

</body>
</html>
