<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - HealthCare AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ===== Basic Reset ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f5f6fa;
            color: #333;
            min-height: 100vh;
        }

        /* ===== Container ===== */
        .settings-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
            color: #2c3e50;
        }

        /* ===== Card Style ===== */
        .settings-card {
            background-color: #fff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .settings-card h3 {
            margin-bottom: 20px;
            font-weight: 500;
            color: #34495e;
        }

        /* ===== Form Elements ===== */
        .settings-card label {
            display: block;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .settings-card input[type="text"],
        .settings-card input[type="email"],
        .settings-card input[type="password"],
        .settings-card input[type="tel"],
        .settings-card select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .settings-card input:focus,
        .settings-card select:focus {
            border-color: #1abc9c;
            outline: none;
        }

        /* ===== Toggle Switch ===== */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #1abc9c;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* ===== Buttons ===== */
        .btn-primary {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: #16a085;
        }

        /* Responsive */
        @media(max-width: 600px) {
            .settings-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="settings-container">
    <h2>Settings</h2>

    <!-- Profile Section -->
    <div class="settings-card">
        <h3>Profile Settings</h3>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@gmail.com">

        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="123-456-7890">

        <button class="btn-primary">Save Profile</button>
    </div>

    <!-- Account Section -->
    <div class="settings-card">
        <h3>Account Settings</h3>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">

        <label for="twofactor">Two-Factor Authentication</label>
        <label class="switch">
            <input type="checkbox" id="twofactor">
            <span class="slider"></span>
        </label>

        <button class="btn-primary">Save Account</button>
    </div>

    <!-- Preferences Section -->
    <div class="settings-card">
        <h3>Preferences</h3>
        <label for="theme">Theme</label>
        <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="auto">Auto</option>
        </select>

        <label for="language">Language</label>
        <select id="language">
            <option value="english">English</option>
            <option value="tamil">Tamil</option>
            <option value="other">Other</option>
        </select>

        <button class="btn-primary">Save Preferences</button>
    </div>

    <!-- Notifications Section -->
    <div class="settings-card">
        <h3>Notifications</h3>
        <label>Email Notifications</label>
        <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
        </label>

        <label>SMS Notifications</label>
        <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
        </label>

        <label>Push Notifications</label>
        <label class="switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
        </label>

        <button class="btn-primary">Save Notifications</button>
    </div>
</div>

<script>
    // Example: alert on save button click
    document.querySelectorAll('.btn-primary').forEach(button => {
        button.addEventListener('click', () => {
            alert('Settings saved successfully!');
        });
    });
</script>

</body>
</html>
