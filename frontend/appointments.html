<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointments</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:0;
        }
        header{
            background:#fd7e14;
            color:white;
            padding:18px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
        }
        .container{
            max-width: 1100px;
            margin: 25px auto;
            padding: 15px;
        }
        .card{
            background:white;
            border-radius:12px;
            padding:18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .topbar{
            display:flex;
            justify-content: space-between;
            align-items:center;
            gap:10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .search-box{
            flex:1;
            min-width: 220px;
        }
        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:10px;
            outline:none;
        }
        table{
            width:100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td{
            text-align:left;
            padding:12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th{
            background:#fff1e6;
            color:#333;
        }
        tr:hover{
            background:#fff7f0;
        }
        .badge{
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display:inline-block;
        }
        .pending{
            background:#fff3cd;
            color:#856404;
        }
        .confirmed{
            background:#d4edda;
            color:#155724;
        }
        .cancelled{
            background:#f8d7da;
            color:#721c24;
        }
        .btn{
            border:none;
            padding:8px 12px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
            font-size: 13px;
        }
        .btn-view{
            background:#fd7e14;
            color:white;
        }
        .btn-cancel{
            background:#dc3545;
            color:white;
        }
        .btn:hover{
            opacity:0.9;
        }
        .back{
            display:inline-block;
            margin-top: 15px;
            text-decoration:none;
            color:#fd7e14;
            font-weight:bold;
        }
        .note{
            margin-top: 10px;
            font-size: 13px;
            color:#666;
        }
    </style>
</head>

<body>
<header>📅 Appointments</header>

<div class="container">
    <div class="card">

        <div class="topbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search patient / hospital / status..." />
            </div>
        </div>

        <!-- Table -->
        <table id="appointmentsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Patient Name</th>
                    <th>Hospital</th>
                    <th>Appointment Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <!-- Static sample rows (DB connect later) -->
                <tr>
                    <td>1</td>
                    <td>Pooja</td>
                    <td>CareMesh Hospital</td>
                    <td>28-Feb-2026 10:30 AM</td>
                    <td><span class="badge pending">PENDING</span></td>
                    <td>
                        <button class="btn btn-view" onclick="viewAppointment(1)">View</button>
                        <button class="btn btn-cancel" onclick="cancelAppointment(1)">Cancel</button>
                    </td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Ravi Kumar</td>
                    <td>City Health Clinic</td>
                    <td>1-Mar-2026 02:00 PM</td>
                    <td><span class="badge confirmed">CONFIRMED</span></td>
                    <td>
                        <button class="btn btn-view" onclick="viewAppointment(2)">View</button>
                        <button class="btn btn-cancel" onclick="cancelAppointment(2)">Cancel</button>
                    </td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Priya Sharma</td>
                    <td>Metro Hospital</td>
                    <td>3-Mar-2026 11:15 AM</td>
                    <td><span class="badge cancelled">CANCELLED</span></td>
                    <td>
                        <button class="btn btn-view" onclick="viewAppointment(3)">View</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <p class="note"></p>

        <a class="back" href="dashboard.html">⬅ Back to Home</a>
    </div>
</div>

<script>
    // Search Filter
    const searchInput = document.getElementById("searchInput");
    const table = document.getElementById("appointmentsTable");
    const rows = table.getElementsByTagName("tr");

    searchInput.addEventListener("keyup", function(){
        const filter = searchInput.value.toLowerCase();

        for(let i=1; i<rows.length; i++){
            const rowText = rows[i].innerText.toLowerCase();
            rows[i].style.display = rowText.includes(filter) ? "" : "none";
        }
    });

    function viewAppointment(id){
        alert("Viewing Appointment ID: " + id);
        // future: window.location.href = "/appointment/" + id;
    }

    function cancelAppointment(id){
        if(confirm("Are you sure you want to cancel Appointment ID: " + id + "?")){
            alert("Appointment Cancelled ID: " + id);
            // future: API call to cancel
        }
    }
</script>

</body>
</html>
